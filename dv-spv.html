<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCOTRACK — Input Laporan</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--nila-50:#F1F3FD;--nila-100:#DEE3F9;--nila-200:#BDC6F1;--nila-300:#94A2E6;--nila-400:#6C7DD6;
--nila-500:#4B5CC0;--nila-600:#3945A2;--nila-700:#2C3684;--nila-800:#232B66;--nila-900:#171D47;
--kabut-50:#FAFAF8;--kabut-100:#F3F3EF;--kabut-200:#E7E7E1;--kabut-300:#D3D3CA;--kabut-400:#A9A99F;
--kabut-500:#7D7D74;--kabut-600:#5D5D56;--kabut-700:#454540;--kabut-800:#2E2E2A;--kabut-900:#1A1A17;
--panen-50:#EBF8F0;--panen-100:#D0EFDD;--panen-200:#A2E0BB;--panen-400:#37AC6F;--panen-500:#1B8E56;--panen-600:#137144;--panen-700:#0F5936;--panen-800:#0B4228;
--senja-50:#FEF6E6;--senja-100:#FCE8C0;--senja-200:#F8D188;--senja-400:#DD941F;--senja-500:#BB7A14;--senja-600:#96610E;--senja-700:#754B0B;--senja-800:#553608;
--delima-50:#FDEDED;--delima-100:#FAD4D4;--delima-200:#F3AAAA;--delima-400:#D94A4A;--delima-500:#BF3131;--delima-600:#9C2525;--delima-700:#7B1D1D;--delima-800:#5B1515;
--f:'Urbanist',system-ui,-apple-system,sans-serif;
--ink:var(--kabut-900);--ink2:var(--kabut-600);--ink3:var(--kabut-500);
--line:#EDEDE8;--lineIn:#DFDFD9;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased}
body{font-family:var(--f);font-size:16px;font-weight:400;line-height:1.55;color:var(--ink);background:#EFF0F5;min-height:100vh}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
i.ti{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;line-height:0;flex:none}
i.ti svg{width:100%;height:100%;display:block}

.demo{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo b{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--nila-800);opacity:.6}
.demo button{font-family:var(--f);font-size:14px;font-weight:500;padding:6px 13px;border:1px solid var(--lineIn);background:var(--kabut-50);border-radius:999px;cursor:pointer;color:var(--kabut-700)}
.demo button:hover{background:#fff;border-color:var(--kabut-400)}
.demo button.on{background:var(--nila-900);border-color:var(--nila-900);color:#fff;font-weight:600}
.demo span{font-size:14px;color:var(--ink3);margin-left:auto}

/* top bar */
.bar{background:var(--nila-900);color:#fff}
.bar .in{max-width:1080px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.brand .lg{width:36px;height:36px;flex:none;border-radius:11px;background:rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center;font-size:20px}
.brand .nm{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.brand .sb{font-size:14px;color:rgba(255,255,255,.5);line-height:1.2}
.barR{margin-left:auto;display:flex;align-items:center;gap:12px}
.swbtn{display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-family:var(--f);font-size:14px;font-weight:600;cursor:pointer}
.swbtn:hover{background:rgba(255,255,255,.16)}
.swbtn i{font-size:18px;color:var(--nila-300)}
.uc{display:flex;align-items:center;gap:10px;padding:5px 10px 5px 5px;border-radius:11px;background:rgba(255,255,255,.09)}
.uc .av{width:32px;height:32px;flex:none;border-radius:9px;background:var(--nila-300);color:var(--nila-900);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.uc .un{font-size:14px;font-weight:600;line-height:1.25;white-space:nowrap}
.uc .ur{font-size:14px;color:rgba(255,255,255,.5);line-height:1.2}
.uc .out{width:28px;height:28px;flex:none;border:0;background:transparent;color:rgba(255,255,255,.55);border-radius:8px;cursor:pointer;font-size:17px}
.uc .out:hover{background:rgba(255,255,255,.14);color:#fff}

.tabs{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tabs .in{max-width:1080px;margin:0 auto;padding:0 22px;display:flex;gap:0;overflow-x:auto;scrollbar-width:none}
.tabs .in::-webkit-scrollbar{display:none}
.tabs a{display:flex;align-items:center;gap:9px;padding:14px 16px;font-size:16px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a i{font-size:19px;color:var(--kabut-500)}
.tabs a:hover{color:var(--nila-800)}
.tabs a.on{color:var(--nila-900);font-weight:700;border-bottom-color:var(--nila-900)}
.tabs a.on i{color:var(--nila-700)}

.wrap{max-width:1080px;margin:0 auto;padding:26px 22px 56px;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
h1{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
h2{font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.25}
h3{font-size:18px;font-weight:600;letter-spacing:-.015em}
.lede{font-size:16px;font-weight:300;color:var(--ink2);margin-top:8px}
.sm{font-size:14px;font-weight:300;color:var(--ink3)}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}

.card{background:#fff;border:1px solid var(--line);border-radius:18px}
.card .hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.card .hd .r{margin-left:auto;display:flex;gap:10px}
.card .bd{padding:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

.q{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.q .lb{font-size:14px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.q .n{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin-top:6px}
.q .ft{font-size:14px;font-weight:300;color:var(--ink3);margin-top:6px}
.q .ft b{font-weight:600;color:var(--kabut-700)}

.btn{font-family:var(--f);font-size:16px;font-weight:600;padding:12px 22px;min-height:50px;border-radius:12px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;line-height:1.2;transition:background .15s,border-color .15s}
.btn i{font-size:20px}
.btn-p{background:var(--nila-900);color:#fff}.btn-p:hover{background:var(--nila-800)}
.btn-g{background:#fff;color:var(--kabut-700);border-color:var(--lineIn)}.btn-g:hover{border-color:var(--kabut-400);background:var(--kabut-50)}
.btn-bad{background:#fff;color:var(--delima-600);border-color:var(--delima-200)}.btn-bad:hover{background:var(--delima-50)}
.btn-sm{font-size:14px;padding:8px 14px;min-height:38px;border-radius:9px}.btn-sm i{font-size:17px}
.btn-lg{font-size:18px;min-height:58px;border-radius:14px}
.btn[disabled]{background:var(--kabut-100);color:var(--kabut-400);border-color:transparent;cursor:not-allowed}
.btnfull{width:100%}

.f{margin-bottom:20px}
.f label{display:block;font-size:16px;font-weight:600;color:var(--kabut-800);margin-bottom:8px}
.f label .opt{font-weight:400;color:var(--ink3);font-size:14px}
select,input,textarea{font-family:var(--f);font-size:16px;font-weight:400;padding:13px 15px;min-height:52px;width:100%;border:1px solid var(--lineIn);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:0;line-height:1.55}
input::placeholder{color:var(--kabut-400);font-weight:300}
input:focus,select:focus,textarea:focus{outline:2px solid var(--nila-300);outline-offset:1px;border-color:var(--nila-500)}
input[disabled],select[disabled]{background:var(--kabut-100);color:var(--kabut-500);cursor:not-allowed}
.f .h{font-size:14px;font-weight:300;color:var(--ink3);margin-top:8px;line-height:1.5}
.f .err{font-size:14px;font-weight:500;color:var(--delima-600);margin-top:8px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sfx{position:relative}.sfx input{padding-right:74px}
.sfx span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:500;color:var(--ink3);pointer-events:none}

.seg{display:flex;gap:10px}
.seg button{flex:1;font-family:var(--f);font-size:16px;font-weight:600;padding:14px;min-height:56px;border-radius:12px;border:1px solid var(--lineIn);background:#fff;color:var(--kabut-700);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px}
.seg button i{font-size:20px}
.seg button:hover{border-color:var(--kabut-400)}
.seg button.on{background:var(--nila-900);border-color:var(--nila-900);color:#fff}
.seg button.on.warn{background:var(--senja-600);border-color:var(--senja-600)}

.batwrap{display:flex;align-items:center;gap:14px}
.batwrap .sfx{flex:1}
.batwrap .sfx input{font-size:24px;font-weight:700;letter-spacing:-.02em;padding-right:52px}
.batwrap .tag{width:104px;flex:none;text-align:center;font-size:14px;font-weight:600;padding:12px 8px;border-radius:12px;line-height:1.3}

.pill{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;padding:4px 12px;border-radius:999px;white-space:nowrap;border:1px solid transparent;line-height:1.45}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.s-ok{background:var(--panen-50);color:var(--panen-800);border-color:var(--panen-100)}
.s-wait{background:var(--senja-50);color:var(--senja-800);border-color:var(--senja-100)}
.s-bad{background:var(--delima-50);color:var(--delima-800);border-color:var(--delima-100)}
.s-run{background:var(--nila-50);color:var(--nila-800);border-color:var(--nila-100)}
.s-off{background:var(--kabut-100);color:var(--kabut-700);border-color:var(--kabut-200)}

.bn{border-radius:13px;padding:15px 18px;font-size:16px;font-weight:300;line-height:1.55;border:1px solid}
.bn b{font-weight:600}
.b-info{background:var(--nila-50);color:var(--nila-800);border-color:var(--nila-100)}
.b-wait{background:var(--senja-50);color:var(--senja-800);border-color:var(--senja-100)}
.b-bad{background:var(--delima-50);color:var(--delima-800);border-color:var(--delima-100)}
.b-ok{background:var(--panen-50);color:var(--panen-800);border-color:var(--panen-100)}

.lrow{display:flex;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid var(--kabut-100);cursor:pointer;transition:background .12s}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--nila-50)}
.lrow .ic{width:44px;height:44px;flex:none;border-radius:13px;background:var(--nila-50);color:var(--nila-700);display:flex;align-items:center;justify-content:center;font-size:20px}
.lrow .mid{flex:1;min-width:0}
.lrow .t1{font-size:16px;font-weight:600;letter-spacing:-.01em}
.lrow .t2{font-size:14px;font-weight:300;color:var(--ink3);margin-top:2px}
.lrow .rt{text-align:right;flex:none}
.lrow .rt .j{font-size:18px;font-weight:700;letter-spacing:-.02em}

.kv{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid var(--kabut-100);min-height:50px;align-items:center}
.kv:last-child{border-bottom:0}.kv:first-child{padding-top:0}
.kv .k{font-size:16px;font-weight:300;color:var(--ink2)}
.kv .v{font-size:16px;font-weight:500;text-align:right}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.search{position:relative;flex:1;min-width:200px;max-width:320px}
.search i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:19px;z-index:1}
.search input{padding-left:44px}
.empty{text-align:center;padding:52px 24px}
.empty i{font-size:40px;color:var(--kabut-300)}

.scrim{position:fixed;inset:0;background:rgba(23,29,71,.42);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px;animation:fade .16s ease}
.modal{background:#fff;border-radius:22px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(23,29,71,.3)}
.modal .hd{padding:24px 26px 18px;border-bottom:1px solid var(--line)}
.modal .hd h3{font-size:20px;font-weight:700;letter-spacing:-.02em}
.modal .bd{padding:24px 26px}
.modal .ft{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.emb{width:66px;height:66px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,90px);background:var(--nila-900);color:#fff;font-size:16px;font-weight:500;padding:14px 22px;border-radius:999px;z-index:120;display:flex;align-items:center;gap:10px;box-shadow:0 14px 40px rgba(23,29,71,.35);transition:transform .26s cubic-bezier(.2,.9,.3,1);max-width:min(560px,90vw)}
.toast.on{transform:translate(-50%,0)}
.toast i{font-size:20px;flex:none}

@media(max-width:820px){.grid3,.grid2,.f2{grid-template-columns:1fr}
 .uc .un,.uc .ur,.swbtn span{display:none}.tabs a{padding:13px 12px}
 h1{font-size:24px}.q .n{font-size:32px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.rw{display:grid;grid-template-columns:36px minmax(150px,1fr) 108px 136px 96px 74px 76px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--kabut-100)}
.rw:last-of-type{border-bottom:0}
.rwhd{display:grid;grid-template-columns:36px minmax(150px,1fr) 108px 136px 96px 74px 76px;gap:10px;font-size:14px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding-bottom:10px;border-bottom:1px solid var(--line)}
.rw .no{font-variant-numeric:tabular-nums;color:var(--ink3);font-weight:600;text-align:center;font-size:15px}
.rw select,.rw input{min-height:46px;padding:10px 11px;font-size:15px;width:100%}
.rw .dur{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink2);font-size:15px;text-align:center;background:var(--kabut-50);border-radius:9px;padding:12px 4px;border:1px solid var(--line)}
.rw .act{display:flex;gap:5px;justify-content:flex-end}
.ib{width:33px;height:33px;flex:none;border:1px solid var(--lineIn);background:#fff;border-radius:9px;cursor:pointer;color:var(--kabut-600);display:flex;align-items:center;justify-content:center;font-size:17px}
.ib:hover{border-color:var(--kabut-400);background:var(--kabut-50)}
.ib.del:hover{border-color:var(--delima-300);color:var(--delima-600);background:var(--delima-50)}
.pbs{display:flex;gap:5px}
.pbs button{flex:1;font-family:var(--f);font-size:14px;font-weight:600;padding:10px 3px;min-height:46px;border-radius:9px;border:1px solid var(--lineIn);background:#fff;color:var(--kabut-600);cursor:pointer}
.pbs button:hover{border-color:var(--kabut-400)}
.pbs button.on{background:var(--kabut-800);border-color:var(--kabut-800);color:#fff}
.pbs button.on.y{background:var(--senja-600);border-color:var(--senja-600)}
.totbar{display:flex;align-items:center;gap:14px;padding-top:18px;margin-top:4px;border-top:2px solid var(--kabut-200)}
.totbar .lbl{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.totbar .val{margin-left:auto;font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hdcard{background:var(--nila-50);border:1px solid var(--nila-100);border-radius:14px;padding:18px 20px}
.hdcard .f{margin-bottom:16px}
.hdcard .f:last-child{margin-bottom:0}
.ro{min-height:50px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--kabut-100);color:var(--ink2);font-size:16px;display:flex;align-items:center;gap:9px}
.tk{display:grid;grid-template-columns:38px 1fr 96px 108px 84px;gap:10px;padding:10px 0;border-bottom:1px solid var(--kabut-100);align-items:center;font-size:15px}
.tk:last-child{border-bottom:0}
.tkhd{display:grid;grid-template-columns:38px 1fr 96px 108px 84px;gap:10px;font-size:14px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding-bottom:9px;border-bottom:1px solid var(--line)}
@media(max-width:900px){
 .rwhd,.tkhd{display:none}
 .rw{grid-template-columns:1fr 1fr;gap:9px;border:1px solid var(--lineIn);border-radius:13px;padding:14px;margin-bottom:11px;position:relative}
 .rw .no{position:absolute;top:-9px;left:13px;background:var(--nila-900);color:#fff;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px}
 .rw .cTask{grid-column:1/-1}
 .rw .act{grid-column:1/-1;justify-content:flex-start;padding-top:2px}
 .tk{grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px}
}
</style>
</head>
<body>

<div class="demo">
  <b>Masuk sebagai</b>
  <button id="r-spv" onclick="setRole('spv')">Supervisor</button>
  <button id="r-dual" onclick="setRole('dual')">Admin + SPV</button>
  <button onclick="S.sc='login';paint()">Layar login</button>
  <button onclick="S.sc='ganti';paint()">Login pertama kali</button>
  <span>Akun Admin + SPV punya tombol pindah platform</span>
</div>

<div id="root"></div>
<div class="toast" id="toast"></div>

bolt:'<path d="M13 3L5 13.5h6L10.5 21L19 10.5h-6z"/>',
building:'<path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"/><path d="M16 9h2a2 2 0 0 1 2 2v10"/><path d="M2.5 21h19"/><path d="M8 7h4"/><path d="M8 11h4"/><path d="M8 15h4"/>',

  </div>

  ${belum.length?`<div class="card mt24" style="border-color:var(--senja-200)"><div class="hd"><div>

   :`<div class="bn b-ok mt24"><b>Semua DCO sudah dilaporkan hari ini.</b> Tidak ada yang terlewat.</div>`}

  <div class="card mt24"><div class="hd"><div><h3>Laporan terakhir yang kamu input</h3>
    <div class="sm">5 laporan terbaru</div></div>
    <div class="r"><button class="btn btn-g btn-sm" onclick="go('riwayat')">Lihat semua <i class="ti ti-arrow-right"></i></button></div></div>
    ${last5.map(l=>`<div class="lrow" onclick="S.sel='${l.id}';S.sc='riwayat';paint()">
      <div class="ic"><i class="ti ti-video"></i></div>
      <div class="mid"><div class="t1">${l.dco}</div>
        <div class="t2">${l.tgl} ${l.jam2} · shift ${l.shift} · ${l.rows.length} task</div></div>
      <div class="rt"><div class="j num">${JAM(jamLap(l))}</div>

  <div class="card mt24"><div class="hd"><div><h3>Progress target task</h3>
    <div class="sm">1 baris task = 1 jam video. Diperbarui tiap laporan masuk.</div></div></div>

    ${TASK.map(t=>{const p=Math.round(t.real/t.target*100);
      const c=p>=100?'var(--panen-500)':p>=70?'var(--nila-500)':p>=40?'var(--senja-400)':'var(--delima-400)';
      return `<div style="display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--kabut-100)">
        <div style="width:210px;flex:none;font-weight:500;font-size:15px">${t.n}</div>
        <div style="flex:1;height:22px;border-radius:7px;background:var(--kabut-100);overflow:hidden">
          <i style="display:block;height:100%;width:${Math.min(100,p)}%;background:${c};border-radius:7px"></i></div>
        <div style="width:140px;flex:none;text-align:right;font-size:14px;font-weight:600">${JAM(t.real)}
          <small style="display:block;font-weight:300;color:var(--ink3)">target ${t.target} jam · ${p}%</small></div>
      </div>`}).join('')}

function mulaiUntuk(d){resetForm();S.form.dco=d;S.sc='buat';paint()}

/* ---------- BUAT LAPORAN ---------- */
const BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtTgl(iso){const d=new Date(iso+'T00:00:00');
  return isNaN(d)?iso:d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear()}

V.buat=()=>{
  const M=me();const F=S.form;
  const opt=(arr,val)=>arr.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('');
  const sh=shiftOf(F.shift);
  return `
  <h1>Buat Laporan Baru</h1>
  <p class="lede">Isi kepala laporan sekali, lalu tambahkan baris task sebanyak yang dikerjakan DCO.</p>

  <div class="hdcard mt24">
    <div class="grid2" style="grid-template-columns:1fr 1fr;gap:18px">
      <div class="f"><label>Tanggal</label>
        <input type="date" value="${F.tgl}" onchange="setHead('tgl',this.value)"></div>
      <div class="f"><label>Shift</label>
        <select onchange="setHead('shift',this.value)"><option value="">Pilih shift</option>
          ${SHIFT.map(x=>`<option ${x.n===F.shift?'selected':''}>${x.n}</option>`).join('')}</select>
        <div class="h">${sh?`Jam ${sh.jam} · durasi kerja efektif ${sh.efektif} jam`:'Jam kerja tampil otomatis setelah shift dipilih'}</div></div>
      <div class="f"><label>Supervisor</label>
        <div class="ro"><i class="ti ti-lock" style="font-size:18px;color:var(--ink3)"></i> ${M.kode} - ${M.n}</div>
        <div class="h">Terisi otomatis dari akun kamu</div></div>
      <div class="f"><label>Nama DCO</label>
        <select onchange="setHead('dco',this.value)"><option value="">Pilih DCO</option>${opt(DCO[M.cb],F.dco)}</select>
        <div class="h">Hanya DCO aktif di cabang ${M.cb}</div></div>
    </div>
  </div>

  <div class="card mt24"><div class="hd"><div><h3>Task yang dikerjakan</h3>
    <div class="sm">Setiap baris dihitung 1 jam video</div></div>
    <div class="r"><button class="btn btn-g btn-sm" onclick="addRow()"><i class="ti ti-plus"></i> Tambah baris</button></div></div>
    <div class="bd">
      <div class="rwhd"><div style="text-align:center">No</div><div>Task</div><div>Device</div><div>Powerbank</div><div>Battery</div><div style="text-align:center">Durasi</div><div></div></div>
      ${F.rows.map((r,i)=>`<div class="rw">
        <div class="no">${i+1}</div>
        <div class="cTask"><select onchange="setRow(${i},'task',this.value)"><option value="">Pilih task</option>${opt(TASK.map(t=>t.n),r.task)}</select></div>
        <div><select onchange="setRow(${i},'device',this.value)"><option value="">Kode</option>${opt(DEVICE[M.cb],r.device)}</select></div>
        <div class="pbs">
          <button class="${r.pb===false?'on':''}" onclick="setRow(${i},'pb',false)">Tidak</button>
          <button class="${r.pb===true?'on y':''}" onclick="setRow(${i},'pb',true)">Ya</button></div>
        <div class="sfx"><input class="num" inputmode="numeric" maxlength="3" placeholder="0" value="${r.bat}"
          oninput="setBatRow(${i},this.value)" style="${isNaN(batNum(r.bat))?'border-color:var(--delima-400)':''}"><span>%</span></div>
        <div class="dur">1 jam</div>
        <div class="act">
          <button class="ib" title="Duplikat baris" onclick="dupRow(${i})"><i class="ti ti-copy"></i></button>
          <button class="ib del" title="Hapus baris" onclick="delRow(${i})"><i class="ti ti-trash"></i></button></div>
      </div>`).join('')}

      <button class="btn btn-g btnfull mt16" onclick="addRow()"><i class="ti ti-plus"></i> Tambah baris task</button>

      <div class="totbar">
        <span class="lbl">Total video</span>
        <span class="val num" id="totVal">${JAM(F.rows.length)}</span>
      </div>
      <div id="warnArea">${warnHtml()}</div>
    </div>
  </div>

  <div class="grid2 mt24" style="grid-template-columns:1fr 1fr;gap:14px">
    <button class="btn btn-p btn-lg" id="simpan" disabled onclick="simpanLaporan(false)"><i class="ti ti-check"></i> Simpan laporan</button>
    <button class="btn btn-g btn-lg" id="simpan2" disabled onclick="simpanLaporan(true)"><i class="ti ti-user-plus"></i> Simpan &amp; buat untuk DCO lain</button>
  </div>
  <button class="btn btn-g btnfull mt16" onclick="resetForm();paint()">Kosongkan form</button>`};

function setHead(k,v){S.form[k]=v;paint()}
function addRow(){S.form.rows.push(blankRow());paint()}
function delRow(i){S.form.rows.splice(i,1);if(!S.form.rows.length)S.form.rows=[blankRow()];paint()}
function dupRow(i){S.form.rows.splice(i+1,0,{...S.form.rows[i]});paint()}
function setRow(i,k,v){S.form.rows[i][k]=v;paint()}

function batNum(v){const t=String(v).trim();if(t==='')return null;
  if(!/^\d{1,3}$/.test(t))return NaN;const n=+t;return (n>=0&&n<=100)?n:NaN}
function setBatRow(i,v){S.form.rows[i].bat=String(v).trim();
  const inp=document.querySelectorAll('.rw .sfx input')[i];
  if(inp)inp.style.borderColor=isNaN(batNum(v))?'var(--delima-400)':'';
  refreshTot()}

function rowOk(r){const b=batNum(r.bat);return !!(r.task&&r.device&&r.pb!==null&&b!==null&&!isNaN(b))}
function formOk(){const F=S.form;return !!(F.tgl&&F.shift&&F.dco&&F.rows.length&&F.rows.every(rowOk))}

function lebihShift(){const sh=shiftOf(S.form.shift);return sh?S.form.rows.length-sh.efektif:0}
function bentrokDevice(){
  const F=S.form;const tgl=fmtTgl(F.tgl);const out=[];
  F.rows.forEach(r=>{if(!r.device)return;
    LAP.forEach(l=>{if(l.tgl===tgl&&l.shift===F.shift&&l.dco!==F.dco&&l.rows.some(x=>x.device===r.device))
      {if(!out.some(o=>o.dev===r.device))out.push({dev:r.device,dco:l.dco})}})});
  return out}

function warnHtml(){
  const F=S.form;let h='';
  const kurang=F.rows.filter(r=>!rowOk(r)).length;
  if(kurang)h+=`<div class="bn b-wait mt16"><b>${kurang} baris belum lengkap.</b> Task, device, powerbank, dan battery wajib diisi di setiap baris.</div>`;
  const lb=lebihShift();
  if(F.shift&&lb>0)h+=`<div class="bn b-wait mt16"><b>Total ${F.rows.length} jam melebihi durasi shift ${F.shift} (${shiftOf(F.shift).efektif} jam).</b> Kalau ini memang lembur, laporan tetap bisa disimpan.</div>`;
  const bt=bentrokDevice();
  if(bt.length)h+=`<div class="bn b-bad mt16"><b>Device ${bt.map(x=>x.dev).join(', ')} sudah tercatat dipakai ${bt.map(x=>x.dco).join(', ')}</b> pada tanggal dan shift yang sama. Pastikan kode devicenya tidak keliru.</div>`;
  const kritis=F.rows.filter(r=>{const b=batNum(r.bat);return b!==null&&!isNaN(b)&&b<20}).length;
  if(kritis)h+=`<div class="bn b-bad mt16"><b>${kritis} baris mencatat baterai di bawah 20%.</b> Device tersebut akan muncul sebagai perhatian khusus di dashboard admin.</div>`;
  return h}

function refreshTot(){
  const t=document.getElementById('totVal');if(t)t.textContent=JAM(S.form.rows.length);
  const w=document.getElementById('warnArea');if(w){w.innerHTML=warnHtml();hydrateIcons()}
  const ok=formOk();
  [['simpan','<i class="ti ti-check"></i> Simpan laporan'],['simpan2','<i class="ti ti-user-plus"></i> Simpan &amp; buat untuk DCO lain']]
    .forEach(([id,lbl])=>{const b=document.getElementById(id);if(!b)return;
      b.disabled=!ok;b.innerHTML=ok?lbl:'Lengkapi semua kolom dulu'});
  hydrateIcons()}

function simpanLaporan(lanjut){
  const F=S.form;const M=me();
  const id='LP-'+(2402+LAP.length);
  const rows=F.rows.map(r=>({task:r.task,device:r.device,pb:r.pb,bat:batNum(r.bat)}));
  LAP.unshift({id,tgl:fmtTgl(F.tgl),jam2:'15:'+String(10+LAP.length).padStart(2,'0'),
    dco:F.dco,shift:F.shift,spv:M.kode+' - '+M.n,baru:true,rows});
  const perTask={};
  rows.forEach(r=>{perTask[r.task]=(perTask[r.task]||0)+1});
  Object.keys(perTask).forEach(n=>{const t=TASK.find(x=>x.n===n);if(t)t.real+=perTask[n]});
  const dcoLama=F.dco, jml=rows.length;
  S.modal=()=>`<div class="scrim" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="bd" style="text-align:center;padding-top:30px">
      <div class="emb" style="background:var(--panen-50);color:var(--panen-600)"><i class="ti ti-circle-check"></i></div>
      <h2 style="margin-top:16px">Laporan tersimpan</h2>
      <p class="sm">${id} · ${dcoLama}</p>
    </div>
    <div class="bd" style="padding-top:0;text-align:left">
      <div class="kv"><span class="k">Shift</span><span class="v">${F.shift}</span></div>
      <div class="kv"><span class="k">Jumlah task</span><span class="v num">${jml} baris</span></div>
      <div class="kv"><span class="k">Jam video ditambahkan</span><span class="v num" style="font-weight:600;color:var(--panen-700)">+${JAM(jml)}</span></div>
      ${Object.keys(perTask).map(n=>{const t=TASK.find(x=>x.n===n);
        return t?`<div class="kv"><span class="k">${n}</span><span class="v num">${JAM(t.real)} dari ${t.target} jam</span></div>`:''}).join('')}
      <div class="bn b-ok mt16">Data langsung masuk ke rekap CMS dan terhitung di dashboard analitik admin.</div>
    </div>
    <div class="ft"><button class="btn btn-g" onclick="closeModal();go('riwayat')">Lihat riwayat</button>
      <button class="btn btn-p" onclick="closeModal();lanjutDCO(${lanjut?'true':'false'})">${lanjut?'Lanjut ke DCO berikutnya':'Selesai'}</button></div>
  </div></div>`;
  resetForm(lanjut);paint();
}
function lanjutDCO(l){closeModal();if(l){S.sc='buat';paint()}else{go('home')}}

/* ---------- RIWAYAT ---------- */
V.riwayat=()=>{
  if(S.sel)return lapDetail();
  let rows=LAP;
  if(S.q)rows=rows.filter(r=>(r.dco+r.rows.map(x=>x.task+x.device).join('')).toLowerCase().includes(S.q.toLowerCase()));
  if(S.fTask!=='Semua')rows=rows.filter(r=>r.rows.some(x=>x.task===S.fTask));
  return `
  <h1>Riwayat Laporan</h1>
  <p class="lede">Semua laporan yang pernah kamu input, urut dari yang terbaru.</p>
  <div class="tools mt24">
    <div class="search"><i class="ti ti-search"></i><input placeholder="Cari DCO, task, atau kode device" value="${S.q}" oninput="S.q=this.value;paint()"></div>
    <input type="date" value="2026-09-01" style="width:auto;min-width:150px">
    <span class="sm">sampai</span>
    <input type="date" value="2026-09-29" style="width:auto;min-width:150px">
    <select style="width:auto;min-width:200px" onchange="S.fTask=this.value;paint()">
      ${['Semua',...TASK.map(t=>t.n)].map(x=>`<option ${S.fTask===x?'selected':''}>${x}</option>`).join('')}</select>
  </div>
  <div class="card">
   ${rows.length?rows.map(l=>`<div class="lrow" onclick="S.sel='${l.id}';paint()">
      <div class="ic"><i class="ti ti-clipboard-list"></i></div>
      <div class="mid"><div class="t1">${l.dco}</div>
        <div class="t2">${l.tgl} ${l.jam2} · shift ${l.shift} · ${l.rows.length} task · ${[...new Set(l.rows.map(r=>r.device))].join(', ')}</div></div>
      <div class="rt"><div class="j num">${JAM(jamLap(l))}</div>
        <div class="sm" style="margin-top:4px">${l.id}</div></div>
      <i class="ti ti-chevron-right" style="font-size:20px;color:var(--kabut-400)"></i>
    </div>`).join('')
   :`<div class="empty"><i class="ti ti-clipboard-list"></i>
     <h3 style="margin-top:12px">Tidak ada laporan yang cocok</h3>
     <p class="sm mt8">Coba ubah filter atau kata pencarian.</p>
     <button class="btn btn-g mt16" onclick="S.q='';S.fTask='Semua';paint()">Reset filter</button></div>`}
  </div>`};

function lapDetail(){
  const l=LAP.find(x=>x.id===S.sel);const M=me();const sh=shiftOf(l.shift);

    <div class="grid2" style="grid-template-columns:repeat(4,1fr);gap:18px">

      <div><div class="sm">Nama DCO</div><div style="font-weight:600;margin-top:3px">${l.dco}</div></div>
    </div>

    <div class="sm">${l.rows.length} task · setiap baris dihitung 1 jam</div></div></div>
    <div class="bd">
      <div class="tkhd"><div style="text-align:center">No</div><div>Task</div><div>Device</div><div>Powerbank</div><div>Battery</div></div>
      ${l.rows.map((r,i)=>`<div class="tk">
        <div class="num" style="text-align:center;color:var(--ink3);font-weight:600">${i+1}</div>
        <div style="font-weight:500">${r.task}</div>
        <div class="num">${r.device}</div>
        <div>${r.pb?pill('wait','Ya'):pill('off','Tidak')}</div>
        <div>${batPill(r.bat)}</div>
      </div>`).join('')}
      <div class="totbar"><span class="lbl">Total video</span><span class="val num">${JAM(jamLap(l))}</span></div>
      ${sh&&l.rows.length>sh.efektif?`<div class="bn b-wait mt16">Total melebihi durasi efektif shift ${l.shift} (${sh.efektif} jam).</div>`:''}

  <div class="grid2 mt24">

          <div style="display:flex;gap:12px;align-items:baseline">
            <div style="flex:1;font-weight:500;font-size:15px">${n}</div>
            <div class="num" style="font-weight:600;color:var(--panen-700)">+${JAM(perTask[n])}</div></div>
          <div style="height:16px;border-radius:6px;background:var(--kabut-100);overflow:hidden;margin-top:8px">
            <i style="display:block;height:100%;width:${Math.min(100,p)}%;background:var(--nila-500);border-radius:6px"></i></div>
          <div class="sm" style="margin-top:5px">${JAM(t.real)} dari ${t.target} jam · ${p}%</div>
        </div>`}).join('')}
    </div></div>

    <div>
      ${l.baru
        ?`<button class="btn btn-g btnfull" onclick="toast('Membuka form edit laporan ${l.id}.','info')"><i class="ti ti-edit"></i> Edit laporan ini</button>
          <div class="bn b-wait mt16"><b>Batas edit 24 jam.</b> Selama masa ini kamu bisa menambah, mengubah, atau menghapus baris task. Lewat dari itu, perubahan harus diajukan ke Admin Cabang. Setiap perubahan tercatat di audit log.</div>`
        :`<div class="bn b-info"><b>Sudah lewat 24 jam.</b> Laporan ini tidak bisa kamu edit sendiri. Ajukan perubahan ke Admin Cabang kalau ada yang keliru.</div>
          <button class="btn btn-g btnfull mt16" onclick="toast('Mengajukan permintaan koreksi ke Admin Cabang.','info')"><i class="ti ti-mail"></i> Ajukan koreksi ke admin</button>`}
      <div class="card mt24"><div class="hd"><h3>Ringkasan device</h3></div><div class="bd">

          const pb=rs.filter(r=>r.pb).length;
          return `<div class="kv"><span class="k">Device ${d}</span><span class="v num">${rs.length} task${pb?` · ${pb} pakai powerbank`:''}</span></div>`}).join('')}
