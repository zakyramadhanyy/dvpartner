<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCOTRACK — Konsol Admin</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--nila-50:#F1F3FD;--nila-100:#DEE3F9;--nila-200:#BDC6F1;--nila-300:#94A2E6;--nila-400:#6C7DD6;
--nila-500:#4B5CC0;--nila-600:#3945A2;--nila-700:#2C3684;--nila-800:#232B66;--nila-900:#171D47;
--kabut-50:#FAFAF8;--kabut-100:#F3F3EF;--kabut-200:#E7E7E1;--kabut-300:#D3D3CA;--kabut-400:#A9A99F;
--kabut-500:#7D7D74;--kabut-600:#5D5D56;--kabut-700:#454540;--kabut-800:#2E2E2A;--kabut-900:#1A1A17;
--panen-50:#EBF8F0;--panen-100:#D0EFDD;--panen-200:#A2E0BB;--panen-400:#37AC6F;--panen-500:#1B8E56;--panen-600:#137144;--panen-700:#0F5936;--panen-800:#0B4228;
--senja-50:#FEF6E6;--senja-100:#FCE8C0;--senja-200:#F8D188;--senja-400:#DD941F;--senja-500:#BB7A14;--senja-600:#96610E;--senja-700:#754B0B;--senja-800:#553608;
--delima-50:#FDEDED;--delima-100:#FAD4D4;--delima-200:#F3AAAA;--delima-400:#D94A4A;--delima-500:#BF3131;--delima-600:#9C2525;--delima-700:#7B1D1D;--delima-800:#5B1515;
--f:'Urbanist',system-ui,-apple-system,sans-serif;
--ink:var(--kabut-900);--ink2:var(--kabut-600);--ink3:var(--kabut-500);
--line:#EDEDE8;--lineIn:#DFDFD9;--page:#FBFBFA;--sd:var(--nila-900);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:var(--f);font-size:16px;font-weight:400;line-height:1.55;color:var(--ink);background:#E9EBF2;padding:20px;min-height:100vh}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
i.ti{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;line-height:0;flex:none}
i.ti svg{width:100%;height:100%;display:block}

/* demo */
.demo{max-width:1440px;margin:0 auto 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 4px}
.demo b{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--nila-800);opacity:.6}
.demo button{font-family:var(--f);font-size:14px;font-weight:500;padding:7px 14px;border:1px solid rgba(23,29,71,.12);background:rgba(255,255,255,.6);border-radius:999px;cursor:pointer;color:var(--nila-800);transition:all .15s}
.demo button:hover{background:#fff}
.demo button.on{background:var(--nila-900);border-color:var(--nila-900);color:#fff;font-weight:600}
.demo span{font-size:14px;color:var(--nila-800);opacity:.55;margin-left:auto}

/* shell */
.app{max-width:1440px;margin:0 auto;display:flex;background:#fff;border-radius:24px;overflow:hidden;min-height:calc(100vh - 96px);box-shadow:0 24px 70px rgba(23,29,71,.13),0 2px 6px rgba(23,29,71,.05)}
.side{width:252px;flex:none;background:var(--sd);padding:22px 14px 18px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 18px}
.brand .lg{width:36px;height:36px;flex:none;border-radius:11px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.brand .nm{font-size:18px;font-weight:700;letter-spacing:-.02em;color:#fff;line-height:1.2}
.brand .sb{font-size:14px;color:rgba(255,255,255,.45);line-height:1.2}
.sfind{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.55);font-size:16px;cursor:pointer}
.sfind:hover{background:rgba(255,255,255,.13)}
.sfind i{font-size:20px}
.sfind .k{margin-left:auto;font-size:14px;font-weight:500;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.1)}
.navgrp{font-size:14px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.35);padding:18px 12px 6px}
.side a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:rgba(255,255,255,.68);text-decoration:none;font-size:16px;font-weight:400;cursor:pointer;margin-bottom:2px;transition:background .15s,color .15s}
.side a i{font-size:20px;flex:none}
.side a:hover{background:rgba(255,255,255,.07);color:#fff}
.side a.on{background:rgba(255,255,255,.11);color:#fff;font-weight:600}
.side a.on::after{content:"";position:absolute;right:0;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:3px 0 0 3px;background:var(--nila-300)}
.side a.off{opacity:.28;cursor:not-allowed}
.side a.off:hover{background:transparent;color:rgba(255,255,255,.68)}
.side .foot{margin-top:auto;padding-top:16px}
.swbtn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-family:var(--f);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;text-align:left}
.swbtn:hover{background:rgba(255,255,255,.14)}
.swbtn i{font-size:18px;color:var(--nila-300)}
.ucard{display:flex;align-items:center;gap:11px;padding:10px;border-radius:13px;background:rgba(255,255,255,.08)}
.ucard .av{width:36px;height:36px;flex:none;border-radius:10px;background:var(--nila-300);color:var(--nila-900);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.ucard .un{font-size:16px;font-weight:600;color:#fff;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ucard .ur{font-size:14px;color:rgba(255,255,255,.5);line-height:1.3}
.ucard .out{margin-left:auto;width:30px;height:30px;flex:none;border:0;background:transparent;color:rgba(255,255,255,.55);border-radius:8px;cursor:pointer;font-size:18px}
.ucard .out:hover{background:rgba(255,255,255,.12);color:#fff}

.main{flex:1;min-width:0;background:var(--page);display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:20px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.top h1{font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.25}
.top .sub{font-size:16px;font-weight:300;color:var(--ink3);margin-top:2px}
.top .act{margin-left:auto;display:flex;gap:10px;align-items:center}
.body{padding:24px 28px 44px;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.btn{font-family:var(--f);font-size:16px;font-weight:600;padding:11px 20px;min-height:46px;border-radius:11px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;transition:background .15s,border-color .15s}
.btn i{font-size:19px}
.btn-p{background:var(--nila-900);color:#fff}.btn-p:hover{background:var(--nila-800)}
.btn-g{background:#fff;color:var(--kabut-700);border-color:var(--lineIn)}.btn-g:hover{border-color:var(--kabut-400);background:var(--kabut-50)}
.btn-ok{background:var(--panen-600);color:#fff}.btn-ok:hover{background:var(--panen-700)}
.btn-bad{background:#fff;color:var(--delima-600);border-color:var(--delima-200)}.btn-bad:hover{background:var(--delima-50)}
.btn-sm{font-size:14px;padding:8px 14px;min-height:38px;border-radius:9px}.btn-sm i{font-size:17px}
.btn[disabled]{background:var(--kabut-100);color:var(--kabut-400);border-color:transparent;cursor:not-allowed}

.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow-x:auto}
.card .hd{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.card .hd h3{font-size:18px;font-weight:600;letter-spacing:-.015em}
.card .hd .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.card .bd{padding:22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mt16{margin-top:16px}.mt24{margin-top:24px}

.q{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.qh{display:flex;align-items:flex-start;gap:12px}
.q .lb{font-size:14px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);line-height:1.4}
.q .ic{margin-left:auto;width:38px;height:38px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px}
.q .n{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:8px}
.q .ft{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--ink3);font-weight:300}
.q .ft b{font-weight:600;color:var(--kabut-700)}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px}
.d-up{background:var(--panen-50);color:var(--panen-700)}
.d-down{background:var(--delima-50);color:var(--delima-600)}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:14px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:13px 18px;border-bottom:1px solid var(--line);background:#fff;white-space:nowrap;position:sticky;top:0;z-index:2}
td{padding:13px 18px;border-bottom:1px solid var(--kabut-100);vertical-align:middle;font-size:16px}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer;transition:background .12s}
tbody tr.click:hover{background:var(--nila-50)}
.nm{font-weight:600;letter-spacing:-.01em}
.sm{font-size:14px;font-weight:300;color:var(--ink3)}
.mono{font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;padding:4px 12px;border-radius:999px;white-space:nowrap;border:1px solid transparent;line-height:1.45}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.s-ok{background:var(--panen-50);color:var(--panen-800);border-color:var(--panen-100)}
.s-wait{background:var(--senja-50);color:var(--senja-800);border-color:var(--senja-100)}
.s-bad{background:var(--delima-50);color:var(--delima-800);border-color:var(--delima-100)}
.s-run{background:var(--nila-50);color:var(--nila-800);border-color:var(--nila-100)}
.s-off{background:var(--kabut-100);color:var(--kabut-700);border-color:var(--kabut-200)}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{position:relative;flex:1;min-width:210px;max-width:320px}
.search i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:19px}
.search input{width:100%;padding-left:44px}
select,input,textarea{font-family:var(--f);font-size:16px;font-weight:400;padding:11px 15px;min-height:46px;border:1px solid var(--lineIn);border-radius:11px;background:#fff;color:var(--ink)}
textarea{min-height:0;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--kabut-400);font-weight:300}
input:focus,select:focus,textarea:focus{outline:2px solid var(--nila-300);outline-offset:1px;border-color:var(--nila-500)}
select[disabled],input[disabled]{background:var(--kabut-100);color:var(--kabut-500);cursor:not-allowed}
.f{margin-bottom:16px}
.f label{display:block;font-size:14px;font-weight:600;color:var(--kabut-700);margin-bottom:7px}
.f input,.f select,.f textarea{width:100%}
.f .h{font-size:14px;font-weight:300;color:var(--ink3);margin-top:7px;line-height:1.5}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sfx{position:relative}.sfx input{padding-right:70px}
.sfx span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:14px;font-weight:500;color:var(--ink3);pointer-events:none}

.kv{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid var(--kabut-100);min-height:48px;align-items:center}
.kv:last-child{border-bottom:0}.kv:first-child{padding-top:0}
.kv .k{font-size:16px;font-weight:300;color:var(--ink2)}
.kv .v{font-size:16px;font-weight:500;text-align:right}

.bn{border-radius:13px;padding:14px 17px;font-size:16px;font-weight:300;line-height:1.55;border:1px solid}
.bn b{font-weight:600}
.b-info{background:var(--nila-50);color:var(--nila-800);border-color:var(--nila-100)}
.b-wait{background:var(--senja-50);color:var(--senja-800);border-color:var(--senja-100)}
.b-bad{background:var(--delima-50);color:var(--delima-800);border-color:var(--delima-100)}
.b-ok{background:var(--panen-50);color:var(--panen-800);border-color:var(--panen-100)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--f);font-size:14px;font-weight:500;padding:9px 15px;border-radius:999px;border:1px solid var(--lineIn);background:#fff;color:var(--kabut-700);cursor:pointer}
.chip:hover{border-color:var(--kabut-400)}
.chip.on{background:var(--nila-900);border-color:var(--nila-900);color:#fff;font-weight:600}

/* grafik */
.prow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--kabut-100)}
.prow:last-child{border-bottom:0}
.prow .pn{width:150px;flex:none;font-size:16px;font-weight:500}
.prow .pb{flex:1;height:26px;border-radius:8px;background:var(--kabut-100);position:relative;overflow:hidden}
.prow .pb i{position:absolute;inset:0 auto 0 0;border-radius:8px;display:block}
.prow .pb .tg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--kabut-500);border-radius:2px}
.prow .pv{width:132px;flex:none;text-align:right;font-size:14px;font-weight:600}
.prow .pv small{display:block;font-size:14px;font-weight:300;color:var(--ink3)}
.bar-ok{background:var(--panen-500)}.bar-wait{background:var(--senja-400)}.bar-bad{background:var(--delima-400)}.bar-run{background:var(--nila-500)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

.empty{text-align:center;padding:52px 24px}
.empty i{font-size:40px;color:var(--kabut-300)}
h2{font-size:18px;font-weight:600;letter-spacing:-.015em;margin-bottom:12px}

.scrim{position:fixed;inset:0;background:rgba(23,29,71,.42);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:80;padding:28px;animation:fade .16s ease}
.modal{background:#fff;border-radius:22px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(23,29,71,.3)}
.modal .hd{padding:24px 26px 18px;border-bottom:1px solid var(--line)}
.modal .hd h3{font-size:20px;font-weight:700;letter-spacing:-.02em}
.modal .bd{padding:24px 26px}
.modal .ft{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,90px);background:var(--nila-900);color:#fff;font-size:16px;font-weight:500;padding:14px 22px;border-radius:999px;z-index:120;display:flex;align-items:center;gap:10px;box-shadow:0 14px 40px rgba(23,29,71,.35);transition:transform .26s cubic-bezier(.2,.9,.3,1);max-width:min(560px,90vw)}
.toast.on{transform:translate(-50%,0)}
.toast i{font-size:20px;flex:none}

@media(max-width:1180px){.grid4{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
@media(max-width:900px){body{padding:10px}.app{border-radius:18px}
 .side{width:80px}.side .lbl,.side .navgrp,.side .nm,.side .sb,.side .sfind .k,.side .un,.side .ur,.side .out,.swbtn span{display:none}
 .side a,.side .sfind,.swbtn{justify-content:center;padding:11px 0}.side .brand,.side .ucard{justify-content:center;padding-left:0}
 .top,.body{padding-left:16px;padding-right:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

  <b>Masuk sebagai</b>
  <button id="r-super" onclick="setRole('super')">Super Admin</button>
  <button id="r-admin" onclick="setRole('admin')">Admin Cabang</button>
  <button id="r-dual" onclick="setRole('dual')">Admin + SPV</button>
  <button onclick="S.sc='login';paint()">Layar login</button>
  <span>Menu di luar wewenang tampil redup</span>
</div>

<div id="root"></div>
<div class="toast" id="toast"></div>

 dual:{n:'Dewi Anggraini',r:'Admin Cabang + SPV',cb:'Jakarta Pusat'}
};
const NAV=[
 ['Utama',[['dash','Dashboard','layout-dashboard',['super','admin','dual']],
           ['laporan','Laporan Pekerjaan','clipboard-list',['super','admin','dual']]]],
 ['Master Data',[['mCabang','Cabang','building',['super']],
                 ['mShift','Shift','clock',['super','admin','dual']],
                 ['mDevice','Device','camera',['super','admin','dual']],
                 ['mDCO','DCO','users',['super','admin','dual']],
                 ['mTask','Task & Target','target',['super','admin','dual']]]],
 ['Pengguna',[['uSpv','Supervisor','user-star',['super','admin','dual']],
              ['uAdmin','Admin Cabang','shield-lock',['super']]]],
 ['Akun',[['profil','Profil','settings',['super','admin','dual']]]]
];

const S={role:'super',sc:'dash',sel:null,modal:null,fCb:'Semua',fTask:'Semua',fPeriode:'30 hari terakhir',q:'',view:'laporan'};

let TT=null;
function toast(msg,kind){const el=document.getElementById('toast');if(!el)return;
  const ic={ok:'circle-check',bad:'alert-circle',info:'info-circle'}[kind||'info'];
  el.innerHTML='<i class="ti ti-'+ic+'"></i><span>'+msg+'</span>';
  el.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>el.classList.remove('on'),3200)}
window.alert=m=>toast(m,'info');

function me(){return ROLES[S.role]}
function can(id){const it=NAV.flatMap(g=>g[1]).find(x=>x[0]===id);return !!(it&&it[3].includes(S.role))}
function setRole(r){S.role=r;if(!can(S.sc))S.sc='dash';S.sel=null;S.modal=null;
  S.fCb=ROLES[r].cb||'Semua';paint()}
function go(id){if(!can(id))return;S.sc=id;S.sel=null;S.modal=null;paint()}
function closeModal(){S.modal=null;paint()}

/* ---------- CAKUPAN DATA ----------
   Super Admin: seluruh cabang aktif, atau satu cabang bila difilter.
   Admin Cabang: dikunci ke cabangnya sendiri. */
function cakupan(){const c=me().cb; if(c)return [c];
  return S.fCb==='Semua'?CBAKTIF.slice():[S.fCb]}
function akumulasi(){return cakupan().length>1}
function inScope(row){return cakupan().includes(row.cabang)}
const lapScoped=()=>LAP.filter(inScope);
const dcoScoped=()=>DCO.filter(inScope);
const devScoped=()=>DEVICE.filter(inScope);
const spvScoped=()=>SPV.filter(inScope);

/* seluruh angka dashboard diturunkan dari REAL/TARGET sesuai cakupan */
const realTask=n=>+(cakupan().reduce((a,c)=>a+((REAL[n]||{})[c]||0),0)).toFixed(1);
const targetTask=n=>(TARGET[n]||0)*cakupan().length;
const realCabang=c=>+(Object.keys(TARGET).reduce((a,n)=>a+((REAL[n]||{})[c]||0),0)).toFixed(1);
const targetCabang=()=>Object.values(TARGET).reduce((a,b)=>a+b,0);
const totalReal=()=>+(cakupan().reduce((a,c)=>a+realCabang(c),0)).toFixed(1);
const totalTarget=()=>targetCabang()*cakupan().length;
const totalLaporan=()=>dcoScoped().reduce((a,d)=>a+d.lap,0);
function trenScoped(){return TRENHARI.map((d,i)=>({d,j:+(cakupan().reduce((a,c)=>a+(TRENCB[c]||[])[i],0)).toFixed(1)}))}
function shiftScoped(){
  const t={Pagi:0,Siang:0,Malam:0};
  cakupan().forEach(c=>Object.keys(t).forEach(k=>t[k]+=(SHIFTCB[c]||{})[k]||0));
  const tot=t.Pagi+t.Siang+t.Malam||1;
  return Object.keys(t).map(k=>({n:k,jml:t[k],v:Math.round(t[k]/tot*100),c:SHIFTWARNA[k]}))}

function paint(){
  ['super','admin','dual'].forEach(r=>{const b=document.getElementById('r-'+r);if(b)b.className=S.role===r?'on':''});
  document.getElementById('root').innerHTML=S.sc==='login'?loginView():shell();
  hydrateIcons();window.scrollTo(0,0);
}

<div style="min-height:calc(100vh - 96px);display:flex;align-items:center;justify-content:center;padding:40px 20px;background:#fff;border-radius:24px">
 <div style="width:100%;max-width:420px">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px">

  <div style="margin-top:28px">
    <div class="f"><label>Email</label><input id="ae" type="email" value="intan.p@dcotrack.id" placeholder="nama@dcotrack.id"></div>
    <div class="f"><label>Password</label><input id="ap" type="password" value="rahasia123" placeholder="Masukkan password"></div>
    <div id="aerr"></div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button class="btn" style="background:transparent;border:0;color:var(--nila-700);min-height:36px;padding:0;font-size:14px" onclick="toast('Link reset dikirim ke email terdaftar, berlaku 30 menit.','ok')">Lupa Password?</button></div>
    <button class="btn btn-p" style="width:100%" onclick="tryLogin()">Masuk<i class="ti ti-arrow-right"></i></button>
  </div>
  <div class="bn b-info mt24">Coba <b>salah@dcotrack.id</b> untuk pesan email belum terdaftar, atau ubah passwordnya untuk pesan kredensial salah.</div>
 </div>
</div>`}

function tryLogin(){
  const e=document.getElementById('ae').value.trim(),p=document.getElementById('ap').value;
  const box=document.getElementById('aerr');
  const akun={'rina.k@dcotrack.id':'super','intan.p@dcotrack.id':'admin','dewi.a@dcotrack.id':'dual'};
  if(!e||!p){box.innerHTML='<div class="bn b-bad" style="margin-bottom:16px">Email dan password wajib diisi.</div>';return}
  if(!akun[e]){box.innerHTML='<div class="bn b-bad" style="margin-bottom:16px">Email belum terdaftar.</div>';return}
  if(p!=='rahasia123'){box.innerHTML='<div class="bn b-bad" style="margin-bottom:16px">Email atau password salah.</div>';return}
  setRole(akun[e]);S.sc='dash';paint();
}

function shell(){
  const M=me();
  let nav='';
  NAV.forEach(([g,items])=>{
    nav+=`<div class="navgrp">${g}</div>`;
    items.forEach(([id,label,ic,roles])=>{
      const ok=roles.includes(S.role);
      nav+=`<a class="${S.sc===id?'on':''} ${ok?'':'off'}" ${ok?`onclick="go('${id}')"`:''} title="${ok?label:'Hanya Super Admin'}">
        <i class="ti ti-${ic}"></i><span class="lbl">${label}</span></a>`;
    });
  });
  const ini=M.n.split(' ').map(x=>x[0]).slice(0,2).join('');
  return `<div class="app">
   <aside class="side">
     <div class="brand"><div class="lg"><i class="ti ti-chart-bar"></i></div>
       <div><div class="nm">DCOTRACK</div><div class="sb">${M.cb||'Semua cabang'}</div></div></div>
     <div class="sfind" onclick="toast('Pencarian global belum tersambung di prototipe ini.','info')">
       <i class="ti ti-search"></i><span class="lbl">Cari</span><span class="k">⌘K</span></div>
     ${nav}
     <div class="foot">
       ${S.role==='dual'?`<button class="swbtn" onclick="toast('Berpindah ke Web App untuk input laporan DCO.','info')">
         <i class="ti ti-arrows-exchange"></i><span>Pindah ke Input Laporan</span></button>`:''}
       <div class="ucard"><div class="av">${ini}</div>
         <div style="min-width:0"><div class="un">${M.n}</div><div class="ur">${M.r}</div></div>
         <button class="out" onclick="S.sc='login';paint()" title="Keluar"><i class="ti ti-logout"></i></button></div>
     </div>
   </aside>
   <main class="main">${(V[S.sc]||V.dash)()}</main>
  </div>${S.modal?S.modal():''}`;
}

function pageTop(t,sub,act){return `<div class="top"><div><h1>${t}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div>${act?`<div class="act">${act}</div>`:''}</div>`}
function pill(kind,txt){return `<span class="pill s-${kind}">${txt}</span>`}
function stTask(t){const p=realTask(t.nama)/(targetTask(t.nama)||1)*100;return p>=100?'ok':p>=70?'run':p>=40?'wait':'bad'}

const V={};

/* ---------- DASHBOARD ANALITIK ---------- */
V.dash=()=>{
  const M=me(), CK=cakupan(), AKU=akumulasi();
  const tasks=TASK.filter(t=>t.status==='aktif');
  const tReal=totalReal(), tTarget=totalTarget();
  const pct=Math.round(tReal/tTarget*100);
  const dev=devScoped(), dcos=dcoScoped();
  const dcoAktif=dcos.filter(d=>d.status==='aktif');
  const maxJam=Math.max(...dev.map(d=>d.jam),1);
  const maxDco=Math.max(...dcos.map(d=>d.jam),1);
  const nLap=totalLaporan();

    <select onchange="S.fTask=this.value;paint()">${['Semua',...tasks.map(t=>t.nama)].map(x=>`<option ${S.fTask===x?'selected':''}>${x==='Semua'?'Semua task':x}</option>`).join('')}</select>
    <select><option>Semua DCO</option>${dcoAktif.map(d=>`<option>${d.nama}</option>`).join('')}</select>
    ${M.cb?`<span class="sm" style="margin-left:auto">Filter cabang terkunci di <b style="font-weight:600;color:var(--kabut-700)">${M.cb}</b></span>`

  </div></div>`;

  const cakupanBar=`<div class="bn ${AKU?'b-info':'b-wait'}" style="margin-bottom:18px;display:flex;gap:12px;align-items:flex-start">

         Target keseluruhan ${tTarget} jam berasal dari ${targetCabang()} jam per cabang dikali ${CK.length} cabang.`
      : `<b>Data dipersempit ke cabang ${CK[0]} saja.</b> ${M.cb?'Admin Cabang hanya melihat data cabangnya sendiri.':'Pilih “Semua cabang” pada filter untuk melihat akumulasi seluruh cabang.'}`}

  const q=(lb,n,tone,ic,ft)=>`<div class="q"><div class="qh"><div class="lb">${lb}</div>

  return pageTop('Dashboard Analitik',`${cakupanLabel} · ${S.fPeriode}`,
    `<button class="btn btn-g" onclick="toast('Menyegarkan data dashboard.','info')"><i class="ti ti-refresh"></i> Segarkan</button>

   ${filt}${cakupanBar}
   <div class="grid4">
     ${q('Total jam video',JAM(tReal),'nila','video',`Dari target <b>${tTarget} jam</b>${AKU?` (${CK.length} cabang)`:''}`)}

         <div class="pv" style="width:104px">${JAM(d.jam)} <small>${d.pakai}× dipakai</small></div></div>`).join('')}
       </div></div>

     <div class="card"><div class="hd"><div><h3>Distribusi laporan per shift</h3>

       <div class="bd" style="display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center">
       ${donut(SD)}
       <div style="min-width:190px">${SD.map(s=>`<div class="kv"><span class="k" style="display:inline-flex;align-items:center;gap:9px">

   <div class="grid2 mt24">

         return ada.map(({t,r})=>`<div class="prow"><div class="pn" style="font-size:15px">${t.nama}</div>
           <div class="pb"><i class="bar-run" style="width:${Math.round(r/maxR*100)}%"></i></div>
           <div class="pv" style="width:78px">${JAM(r)}</div></div>`).join('')})()}
       </div>

         return kosong.length?`<div class="bd" style="padding-top:0"><div class="bn b-bad">

         :`<div class="bd" style="padding-top:0"><div class="bn b-ok">Seluruh task aktif sudah pernah dilaporkan pada periode ini.</div></div>`})()}
     </div>
   </div>
  </div>`};

function donut(data){
  const R=54,C=2*Math.PI*R;let off=0;
  const segs=data.map(d=>{const len=d.v/100*C;const s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${d.c}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Distribusi laporan per shift">${segs}
    <text x="70" y="66" text-anchor="middle" font-family="Urbanist" font-size="24" font-weight="700" fill="#1A1A17">100%</text>
    <text x="70" y="86" text-anchor="middle" font-family="Urbanist" font-size="14" font-weight="300" fill="#7D7D74">laporan</text></svg>`}

function lineChart(data){
  const W=560,H=210,P={l:44,r:14,t:16,b:32};
  const max=Math.ceil(Math.max(...data.map(d=>d.j))/5)*5;
  const x=i=>P.l+i*(W-P.l-P.r)/(data.length-1);
  const y=v=>H-P.b-(v/max)*(H-P.t-P.b);
  const pts=data.map((d,i)=>`${x(i)},${y(d.j)}`).join(' ');
  const area=`M${x(0)},${H-P.b} L`+pts.replace(/ /g,' L')+` L${x(data.length-1)},${H-P.b} Z`;
  let grid='';for(let g=0;g<=4;g++){const v=max*g/4;grid+=`<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" stroke="#EDEDE8"/>
    <text x="${P.l-10}" y="${y(v)+5}" text-anchor="end" font-size="13" fill="#7D7D74" font-family="Urbanist" font-weight="300">${v}</text>`}
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tren jam video tujuh hari terakhir">
    ${grid}
    <path d="${area}" fill="var(--nila-100)" opacity=".55"/>
    <polyline points="${pts}" fill="none" stroke="var(--nila-600)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.j)}" r="4" fill="#fff" stroke="var(--nila-600)" stroke-width="2.5"/>
      <text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="13" fill="#7D7D74" font-family="Urbanist" font-weight="300">${d.d}</text>`).join('')}
  </svg>`}

V.mTask=()=>masterHead('Master Data Task & Target Jam',akumulasi()?`Target per cabang ${targetCabang()} jam · akumulasi ${cakupan().length} cabang jadi ${totalTarget()} jam`:`Target untuk cabang ${cakupan()[0]}`,"formTask()",true)+`<div class="body">
  <div class="card"><table><thead><tr><th>Nama Task</th><th>Deskripsi</th><th>Target Jam</th><th>Realisasi</th><th>Pencapaian</th><th>Status</th><th></th></tr></thead><tbody>
  ${TASK.map(t=>{const r=realTask(t.nama),tg=targetTask(t.nama)||t.target;
   const p=Math.round(r/tg*100);const k=stTask(t);
   return `<tr><td><span class="nm">${t.nama}</span></td>
    <td class="sm" style="font-size:16px;font-weight:400;color:var(--ink2);max-width:320px">${t.desc}</td>
    <td class="mono" style="font-weight:600">${tg} jam${akumulasi()?`<div class="sm">${TARGET[t.nama]||t.target} × ${cakupan().length} cabang</div>`:''}</td>
    <td class="mono">${JAM(r)}</td>
    <td style="min-width:170px"><div style="display:flex;align-items:center;gap:10px">
      <div style="flex:1;height:8px;border-radius:4px;background:var(--kabut-100);overflow:hidden">
        <i style="display:block;height:100%;width:${Math.min(100,p)}%;border-radius:4px" class="bar-${k}"></i></div>
      <span class="mono" style="font-weight:600;font-size:14px">${p}%</span></div></td>
    <td>${t.status==='aktif'?pill('ok','Aktif'):pill('off','Draft')}</td>
    <td style="text-align:right">${S.role==='super'?`<button class="btn btn-g btn-sm" onclick="formTask('${t.id}')"><i class="ti ti-edit"></i> Edit</button>`:'<span class="sm">Baca saja</span>'}</td></tr>`}).join('')}
  </tbody></table></div>
  <div class="bn b-wait mt16"><b>Perubahan target tercatat dengan tanggal efektif.</b> Progress periode lama tidak ikut berubah ketika target baru ditetapkan, sehingga laporan bulan sebelumnya tetap valid.</div>
 </div>`;

 S.modal=()=>`<div class="scrim" onclick="if(event.target===this)closeModal()"><div class="modal">
